<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New reply in {{ thread_title }}</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">

    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 24px; text-align: center; border-radius: 10px 10px 0 0;">
        <h1 style="color: white; margin: 0; font-size: 22px;">New discussion reply</h1>
    </div>

    <div style="background-color: #f8f9fa; padding: 28px; border-radius: 0 0 10px 10px;">

        <p style="font-size: 16px;">Hello {{ user_name }},</p>

        <p style="font-size: 16px;">
            <strong>{{ reply_author }}</strong> replied to
            <strong>{{ thread_title }}</strong> in <em>{{ course_title }}</em>.
        </p>

        <blockquote style="background-color: white; border-left: 4px solid #667eea; margin: 20px 0; padding: 14px 18px; border-radius: 6px; color: #555;">
            {{ reply_excerpt }}
        </blockquote>

        <div style="text-align: center; margin: 28px 0;">
            <a href="{{ thread_url }}"
               style="background-color: #667eea; color: white; padding: 12px 28px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: 600;">
                View discussion
            </a>
        </div>

        <hr style="border: none; border-top: 1px solid #ddd; margin: 28px 0;">

        <p style="font-size: 13px; color: #666;">
            You're receiving this because you started or took part in this thread.
        </p>
    </div>

</body>
</html>
