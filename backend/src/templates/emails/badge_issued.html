<!DOCTYPE html>
<html>

<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; line-height: 1.5; color: #1a1a1a; margin: 0; background-color: #f4f5f7;">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f4f5f7;">
        <tr>
            <td align="center" style="padding: 32px 16px;">
                <table cellpadding="0" cellspacing="0" border="0"
                    style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 10px; padding: 32px;">
                    <tr>
                        <td align="center">
                            <h2 style="margin: 0 0 12px; font-size: 22px; font-weight: 600;">
                                You earned a badge!
                            </h2>
                            <p style="margin: 0 0 16px; font-size: 15px;">
                                Congrats, {{ user_name|default:"there" }} — you earned the
                                <strong>{{ badge_name }}</strong> badge for completing
                                <strong>{{ event_title }}</strong>.
                            </p>
                            {% if badge_url %}
                            <div style="margin: 24px 0;">
                                <img src="{{ badge_url }}" alt="{{ badge_name }}"
                                    style="max-width: 220px; height: auto;" />
                            </div>
                            {% endif %}
                            {% if verification_url %}
                            <p style="text-align: center; margin: 24px 0;">
                                <a href="{{ verification_url }}"
                                    style="background-color: #6f42c1; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600;">View
                                    & Share Badge</a>
                            </p>
                            <p style="margin: 8px 0; font-size: 13px; color: #4a4a4a;">
                                Verifiable at:
                                <a href="{{ verification_url }}"
                                    style="color: #0c66e4; word-break: break-all;">{{ verification_url }}</a>
                            </p>
                            {% endif %}
                            <p style="margin: 24px 0 0; font-size: 13px; color: #9a9a9a;">
                                — The Accredit Team
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
