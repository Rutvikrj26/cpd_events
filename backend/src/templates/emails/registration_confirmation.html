<!DOCTYPE html>
<html>

<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; line-height: 1.5; color: #1a1a1a; margin: 0; background-color: #f4f5f7;">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f4f5f7;">
        <tr>
            <td align="center" style="padding: 32px 16px;">
                <table cellpadding="0" cellspacing="0" border="0"
                    style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 10px; padding: 32px;">
                    <tr>
                        <td>
                            <h2 style="margin: 0 0 12px; font-size: 22px; font-weight: 600;">Registration Confirmed</h2>
                            <p style="margin: 0 0 16px; font-size: 15px;">
                                Hi {{ user_name|default:"there" }}, you're confirmed for
                                <strong>{{ event_title }}</strong>.
                            </p>
                            {% include "emails/_event_meta.html" %}
                            <p style="margin: 24px 0 8px; font-size: 14px; color: #4a4a4a;">
                                We've also attached a calendar invite (<code>event.ics</code>) — open it in your inbox
                                to add this event to your calendar.
                            </p>
                            <p style="margin: 24px 0 0; font-size: 13px; color: #9a9a9a;">
                                — The Accredit Team
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
