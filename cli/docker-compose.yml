version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cpd_postgres
    environment:
      POSTGRES_DB: cpd_events
      POSTGRES_USER: cpd_user
      POSTGRES_PASSWORD: cpd_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpd_user -d cpd_events"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GCP Cloud Tasks Emulator (for local development)
  cloud-tasks-emulator:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    container_name: cpd_cloud_tasks
    command: -host 0.0.0.0 -port 8123 -queue "projects/dev-project/locations/us-central1/queues/default"
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GCP Cloud Storage Emulator (for local development)
  gcs-emulator:
    image: fsouza/fake-gcs-server:latest
    container_name: cpd_gcs_emulator
    command: -scheme http -port 4443 -external-url http://localhost:4443
    ports:
      - "4443:4443"
    volumes:
      - gcs_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4443"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django Application
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: cpd_backend
    # Use uv run so the venv built into /app/.venv (during image build) is on PATH.
    command: uv run python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/mediafiles
      # Shared with livekit-egress so the Django streaming endpoint can
      # read whatever egress wrote. In cloud-run this is a GCS-fuse mount.
      - recording_data:/recordings
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env.dev
    environment:
      # Docker-specific overrides (DB host points to container)
      DB_HOST: db
      # GCP emulators for local development
      CLOUD_TASKS_EMULATOR_HOST: cloud-tasks-emulator:8123
      GCS_EMULATOR_HOST: http://gcs-emulator:4443
      # LiveKit configuration
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret_dev_key_change_in_production
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_WS_URL: ws://localhost:7880
      # Deployment configuration
      DEPLOYMENT_MODE: single_tenant
      REGISTRATION_MODE: invite_only
      INSTITUTION_NAME: Accredit
    depends_on:
      db:
        condition: service_healthy
      cloud-tasks-emulator:
        condition: service_healthy
      gcs-emulator:
        condition: service_healthy
    stdin_open: true
    tty: true

  # LiveKit Video Conferencing Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: cpd_livekit
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    ports:
      - "7880:7880"      # HTTP API + WebSocket signaling
      - "7881:7881"      # RTC (WebRTC TCP)
      - "7882:7882/udp"  # RTC (WebRTC UDP)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis — message bus required by livekit-egress.
  redis:
    image: redis:7-alpine
    container_name: cpd_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # LiveKit Egress (Recording Service)
  # Init container that fixes /recordings permissions before egress starts.
  # The recording_data named volume is owned by root by default; egress runs
  # as uid=1001 and would otherwise fail with "permission denied" on write.
  recording-perms:
    image: alpine
    command: sh -c "chmod 0777 /recordings"
    volumes:
      - recording_data:/recordings
    restart: 'no'

  livekit-egress:
    image: livekit/egress:latest
    container_name: cpd_livekit_egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - recording_data:/recordings
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
      recording-perms:
        condition: service_completed_successfully
    restart: unless-stopped

  # Frontend React Application (optional - if you want to dockerize frontend too)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: cpd_frontend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_URL: http://localhost:8000
  #   command: npm run dev -- --host
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
  gcs_data:
  backend_static:
  backend_media:
  recording_data:
