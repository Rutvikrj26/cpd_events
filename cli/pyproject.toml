[project]
name = "accredit"
version = "0.1.0"
description = "CLI tool for CPD Events platform management"
authors = [
    {name = "Rutvik Solanki", email = "rutvikrj26@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
accredit = "accredit.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
